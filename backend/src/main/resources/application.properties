spring.application.name=nexushr-backend

server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

# =========================================================
# PostgreSQL Database
# =========================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexushr_db}
spring.datasource.username=${DATABASE_USERNAME:nexushr_user}
spring.datasource.password=${DATABASE_PASSWORD}

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# JSON
# =========================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================================================
# JWT
# =========================================================
nexushr.jwt.secret=${JWT_SECRET:nexushr-local-development-jwt-secret-change-before-production-2026}
nexushr.jwt.expiration=${JWT_EXPIRATION:86400000}
nexushr.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# =========================================================
# Authentication Cookie
# =========================================================
nexushr.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
nexushr.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}


# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.nexushr.security=${SECURITY_LOG_LEVEL:INFO}

# =========================================================
# Leave Entitlements
# =========================================================
nexushr.leave.entitlement.casual=${LEAVE_ENTITLEMENT_CASUAL:12}
nexushr.leave.entitlement.sick=${LEAVE_ENTITLEMENT_SICK:12}
nexushr.leave.entitlement.annual=${LEAVE_ENTITLEMENT_ANNUAL:18}

# =========================================================
# Gmail / Email Notifications
# =========================================================
nexushr.notifications.email.enabled=${MAIL_ENABLED:false}
nexushr.notifications.email.from=${MAIL_FROM:${MAIL_USERNAME:}}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}

spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}

# Prevent SMTP configuration from marking entire application unhealthy
management.health.mail.enabled=false

# =========================================================
# SMS Notification Simulation
# =========================================================
nexushr.notifications.sms.simulation-enabled=${SMS_SIMULATION_ENABLED:true}

# =========================================================
# Flyway
# =========================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing NexusHR database
spring.flyway.locations=classpath:db/migration

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}

# =========================================================
# CORS
# =========================================================
nexushr.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================================================
# Optional First-Run Users
# =========================================================
nexushr.seed-default-users=${SEED_DEFAULT_USERS:false}

nexushr.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
nexushr.seed.admin.password=${SEED_ADMIN_PASSWORD:}

nexushr.seed.manager.username=${SEED_MANAGER_USERNAME:manager}
nexushr.seed.manager.password=${SEED_MANAGER_PASSWORD:}

nexushr.seed.employee.username=${SEED_EMPLOYEE_USERNAME:employee}
nexushr.seed.employee.password=${SEED_EMPLOYEE_PASSWORD:}
# =========================================================
# Optional real SMS provider (Twilio)
# Major/long content should stay in email; SMS is a short alert.
# =========================================================
nexushr.notifications.sms.provider=${SMS_PROVIDER:SIMULATION}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# =========================================================
# Payroll Policy Engine (demo/configurable; verify statutory values)
# =========================================================
payroll.tax-rate=${PAYROLL_TAX_RATE:0.10}
payroll.batch.allowance-rate=${PAYROLL_ALLOWANCE_RATE:0.10}
payroll.batch.pf-rate=${PAYROLL_PF_RATE:0.12}
payroll.batch.professional-tax=${PAYROLL_PROFESSIONAL_TAX:200}

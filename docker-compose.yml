services:

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexushr_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexushr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - nexushr-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nexushr_user} -d ${POSTGRES_DB:-nexushr_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # ==============================
      # SERVER
      # ==============================
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"

      # ==============================
      # DATABASE
      # ==============================
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexushr_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-nexushr_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

      # ==============================
      # JWT
      # ==============================
      JWT_SECRET: ${JWT_SECRET:-nexushr-local-development-jwt-secret-change-before-production-2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # ==============================
      # DATABASE MIGRATION / JPA
      # ==============================
      FLYWAY_ENABLED: "true"
      JPA_SHOW_SQL: "false"

      # ==============================
      # CORS
      # ==============================
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

      # ==============================
      # EMAIL / GMAIL
      # ==============================
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}

      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}

      # ==============================
      # SMS
      # ==============================
      SMS_SIMULATION_ENABLED: ${SMS_SIMULATION_ENABLED:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-SIMULATION}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}

      # ==============================
      # DEFAULT USER SEEDING
      # ==============================
      SEED_DEFAULT_USERS: ${SEED_DEFAULT_USERS:-false}

      # ADMIN
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

      # MANAGER
      SEED_MANAGER_USERNAME: ${SEED_MANAGER_USERNAME:-manager}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}

      # EMPLOYEE
      SEED_EMPLOYEE_USERNAME: ${SEED_EMPLOYEE_USERNAME:-employee}
      SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD:-}

      # ==============================
      # PAYROLL POLICY ENGINE
      # ==============================
      PAYROLL_TAX_RATE: ${PAYROLL_TAX_RATE:-0.10}
      PAYROLL_ALLOWANCE_RATE: ${PAYROLL_ALLOWANCE_RATE:-0.10}
      PAYROLL_PF_RATE: ${PAYROLL_PF_RATE:-0.12}
      PAYROLL_PROFESSIONAL_TAX: ${PAYROLL_PROFESSIONAL_TAX:-200}

      # ==============================
      # HEALTH
      # ==============================
      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-never}

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_BASE_URL: /api

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${APP_PORT:-80}:80"

volumes:
  nexushr-postgres-data: